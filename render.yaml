services:
  - type: web
    name: self-smart-checkout-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health/ready
    autoDeployTrigger: 'off'
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.21.0
      - key: PAYMENT_MODE
        value: sandbox
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
